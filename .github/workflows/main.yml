name: Build JaxClient 1.1.0

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
          cache-dependency-path: |
            jaxclient/gradle/wrapper/gradle-wrapper.properties
            jaxclient/gradle.properties
            jaxclient/build.gradle

      - name: Build JaxClient
        working-directory: ./jaxclient
        run: |
          chmod +x gradlew
          ./gradlew clean build --no-daemon

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: JaxClient-1.1.0
          path: jaxclient/build/libs/*.jar
          if-no-files-found: error
